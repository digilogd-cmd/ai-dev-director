# AI DEV DIRECTOR configuration
# Strict NO PAY-PER-USE API policy: every agent runs through an official, signed-in CLI session
# (Claude Code / OpenAI Codex). API keys, bearer tokens and endpoint overrides in the environment are stripped before
# any CLI call. Limits: see "알려진 한계" in the README.

head:
  provider: claude        # HEAD plans and directs corrections; the Reviewer judges independently.
  # The model is whatever the CLI account's default model is; model flags are not passed through.
  executable: null        # Discovered automatically (PATH or the standard install folder)

builder:
  mode: proposal          # Builder returns whole files as JSON; the Director validates and writes them.
  provider: codex         # BUILDER: OpenAI Codex CLI (failover: claude)
  model: codex-cli
  executable: null        # Discovered automatically via resolve_cli('codex')

reviewer:
  provider: claude        # REVIEWER: Claude Code CLI (failover: codex)
  model: claude-code-cli
  executable: null        # Discovered automatically via resolve_cli('claude')

# Google Antigravity (`agy`) is OFF by default. Google's Antigravity FAQ says that wrapping `agy` inside another
# application is not supported on consumer plans and can lead to account suspension
# (https://antigravity.google/docs/faq/). Turn it on only if your plan allows it and you accept that risk; then
# `provider: antigravity` works for a role again and the three-way TRIAD research mode becomes available.
antigravity:
  enabled: false

timeouts:
  head: 300
  builder: 600
  reviewer: 300
  no_progress: 180
  heartbeat: 30

safety:
  # A document outside the project is handed to the Builder only when it lives in one of these folders.
  # Example: reference_roots: ["D:/work/specs"]
  reference_roots: []
  max_files_changed: 15
  max_diff_lines: 1500     # Complete greenfield modules commonly exceed 800; path/file caps still apply.
  approved_commands:
    - python
    - pytest
    - npm
    - cargo
    - go
    - make

verification:
  build_command: null
  test_command: "python -m pytest tests/"
  lint_command: null

bootstrap:
  enabled: true

# Per-project verification (kept here, never inside the project, so a Builder cannot weaken it).
# Keys are absolute project roots. Example:
# projects:
#   "D:/work/my_service":
#     verification:
#       build_command: ["npm", "run", "build"]
#       test_command: "python -m pytest -q"
projects: {}

autonomy:
  enabled: true
  max_repairs: 3
  # HEAD proxy: HEAD decides on the operator's behalf. Only money (payments, paid services, live-account orders),
  # real credentials/accounts and irreversible external actions stop for a human decision.
  head_proxy: true
  # false (default): a run that exceeds max_files_changed / max_diff_lines, or touches dependency / build /
  # permission configuration, stops. true: HEAD proxy lets it through without asking (logged as HEAD_PROXY_WAIVER).
  waive_scope_caps: false
  builder_attempts: 3          # retry with feedback; the last attempt moves to another provider
  max_steps: 6                 # milestones per mission
  max_ai_calls: 36             # every AI call of a mission counts (failed ones too); the mission stops at the limit and keeps its work. 0 = no limit
  max_consecutive_failures: 3
  resume_on_start: false       # true: a companion restart continues interrupted (RUNNING) missions on its own
  # A finished mission is applied to the project on its own:
  # off | on_done (only when HEAD declared the goal done) | on_pass (any PASSED deliverable).
  # Apply never overwrites a file the operator changed meanwhile (conflict -> blocked, worktree kept) and never deletes.
  # Default "off": you press 반영 after looking at the result.
  auto_apply: "off"
  profiles:                    # budgets per request size; gates and Scope Guard are the same in every profile
    quick:    {max_steps: 2, max_repairs: 1, builder_attempts: 2, max_ai_calls: 12}
    standard: {max_steps: 6, max_repairs: 3, builder_attempts: 3, max_ai_calls: 36}
    deep:     {max_steps: 12, max_repairs: 3, builder_attempts: 3, max_ai_calls: 72}

# Optional external commissioner (a separate "CEO" service that posts goal-level missions to /ops/solomon).
# Only git projects under allowed_roots may be targeted; the Director's own folder is never a target.
solomon:
  allowed_roots:
    - "D:/work"
  denied:
    - "D:/work/ai-dev-director"
